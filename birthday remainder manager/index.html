<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Reminder Manager</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🎂 Birthday Reminder Manager</h1>
        <p>Never forget an important birthday!</p>
    </header>

    <main>

        <section class="form-section">
            <h2>Add Birthday</h2>

            <form id="birthdayForm">

                <label for="name">Person Name</label>
                <input type="text" id="name" placeholder="Enter name" required>

                <label for="birthday">Birthday</label>
                <input type="date" id="birthday" required>

                <button type="submit">➕ Add Birthday</button>

            </form>
        </section>

        <section class="search-section">
            <input
                type="text"
                id="search"
                placeholder="🔍 Search birthday..."
            >
        </section>

        <section class="stats">

            <div class="stat-card">
                <h3 id="totalCount">0</h3>
                <p>Total Birthdays</p>
            </div>

            <div class="stat-card">
                <h3 id="upcomingCount">0</h3>
                <p>Upcoming</p>
            </div>

        </section>

        <section class="birthday-section">

            <h2>🎈 Birthday List</h2>

            <div id="birthdayList">
                <p class="empty">No birthdays added yet.</p>
            </div>

        </section>

    </main>

    <footer>
        <p>Birthday Reminder Manager © 2026</p>
    </footer>

    <script src="script.js"></script>

</body>
</html>
